services:
  neo4j:
    image: neo4j:5.26-community
    container_name: hermes-neo4j-graphrag
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # Browser Web UI (Localhost apenas por segurança)
      - "127.0.0.1:7687:7687" # Protocolo Bolt (Conexão do Hermes / Scripts)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  hermes-net:
    external: true

volumes:
  neo4j_data:
  neo4j_logs:
